name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # verify runs surefire (unit + embedded-broker tests) and then failsafe (Testcontainers),
      # so a unit failure still stops the build before any container is pulled.
      - name: Build and test
        run: ./mvnw -B --no-transfer-progress clean verify

      # Integration tests disable themselves when no Docker daemon is reachable, which is what
      # keeps the build green on a developer machine without one. On CI that same behaviour would
      # turn a broken runner into a silent pass, so here it is treated as a failure.
      - name: Fail if integration tests were skipped
        run: |
          reports=(target/failsafe-reports/TEST-*.xml)
          if [ ! -e "${reports[0]}" ]; then
            echo "::error::no failsafe reports produced — integration tests did not run"
            exit 1
          fi
          skipped=$(grep -ho 'skipped="[0-9]*"' "${reports[@]}" | grep -oE '[0-9]+' | paste -sd+ - | bc)
          if [ "${skipped:-0}" -gt 0 ]; then
            echo "::error::$skipped integration test(s) skipped; Docker must be available on CI"
            exit 1
          fi
          echo "all integration tests executed"

      - name: Package application
        run: ./mvnw -B --no-transfer-progress package -DskipTests

      # Surefire XML is the only way to see which test failed once the job is red.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          retention-days: 7
