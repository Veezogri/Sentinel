spring:
  application:
    name: sentinel
    # Filtered by the Maven resources plugin: the build is the single source of
    # truth for the version reported by /api/v1/system/health.
    version: @project.version@

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # Kept narrow on purpose. Endpoints are opened one at a time, as the
        # milestone that needs them lands (metrics/prometheus arrive with M14).
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  application:
    name: ${spring.application.name}
    version: ${spring.application.version}

logging:
  pattern:
    # correlationId is reserved in the pattern now so that log format stays stable
    # once MDC propagation is wired in (M14). It renders empty until then.
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%X{correlationId:-}] %-40.40logger{39} : %m%n"
  level:
    com.sentinel: INFO
